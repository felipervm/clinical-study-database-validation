name: Validate fictional clinical data work sample
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python edit-check tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax validation
        run: |
          node --check model.js
          node --check app.js
          node --check data.js
      - name: Generate example query log
        run: python src/validate.py > /tmp/fictional-queries.json
